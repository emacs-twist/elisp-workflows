name: Run melpazoid on your rice project

on:
  workflow_call:
    inputs:
      rice-config:
        required: false
        type: string
        default: 'github:emacs-twist/rice-config'
      melpa:
        required: false
        type: string
        default: 'github:melpa/melpa'
      registries:
        required: false
        type: string
        default: 'github:emacs-twist/registries'
      lock-dir:
        required: false
        type: string
        default: '.rice-lock/default'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          # Pin the Nix version to temporarily work around a Nix bug.
          # See https://github.com/emacs-twist/twist.nix/issues/159
          install_url: https://releases.nixos.org/nix/nix-2.20.8/install

      - name: Get the matrix
        id: matrix
        env:
          LOCK_DIR: ${{ inputs.lock-dir }}
          MELPA: ${{ inputs.melpa }}
          REGISTRIES: ${{ inputs.registries }}
          RICE_CONFIG: ${{ inputs.rice-config }}
        run: |
          set -e
          nix_args=(
            --override-input registries "$REGISTRIES"
            --override-input rice-src "path:$PWD"
            --override-input melpa "$MELPA"
          )
          if [[ -n "$LOCK_DIR" ]]; then
            nix_args+=(--override-input rice-lock "path:$PWD/$LOCK_DIR")
          fi
          echo "include=$(nix eval "${RICE_CONFIG}#melpaRecipes" \
            --json \
            --apply 'attrs: builtins.attrValues (builtins.mapAttrs (package: recipe: { inherit package recipe; }) attrs)' \
            "${nix_args[@]}")" >> "$GITHUB_OUTPUT"

  check:
    needs: matrix

    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        path: src

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        repository: riscy/melpazoid
        path: melpazoid

    # Install Python and melpazoid in the same way as the original repository.
    # See https://github.com/riscy/melpazoid/blob/master/.github/workflows/test.yml
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: 3.13.2

    - name: Install melpazoid
      working-directory: melpazoid
      run: |
        sudo apt-get install emacs
        emacs --version
        python -m pip install --upgrade pip
        pip install . mypy pytest black

    - name: Check the package using melpazoid
      working-directory: melpazoid
      env:
        RECIPE: ${{ matrix.recipe }}
        EXIST_OK: true
      run: |
        RECIPE="$RECIPE" LOCAL_REPO="${GITHUB_WORKSPACE}/src" make
